<!DOCTYPE html>
<html class="scroll-smooth" lang="bn">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>সাইন ইন - BDN</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Anek+Bangla:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- External CSS (Navigating up one level to style/style.css) -->
    <link rel="stylesheet" href="../style/style.css"/>
</head>
<body class="bg-[#f9f9ff] text-[#141b2b] font-bangla min-h-screen flex flex-col justify-between selection:bg-[#ffdad6] selection:text-[#b70011]">

    <!-- Navigation Header -->
    <nav class="w-full bg-white/80 backdrop-blur-md border-b border-gray-100 shadow-sm">
        <div class="flex justify-between items-center px-4 md:px-12 h-20 w-full max-w-7xl mx-auto">
            <a href="../index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full primary-gradient flex items-center justify-center text-white shadow-md">
                    <span class="material-symbols-outlined text-2xl">favorite</span>
                </div>
                <span class="font-display text-2xl font-extrabold tracking-tight text-[#b70011]">BDN</span>
            </a>
            <div class="flex items-center gap-2 text-sm text-gray-600">
                <span>একাউন্ট নেই?</span>
                <a href="signup.html" class="font-bold text-[#b70011] hover:underline">নিবন্ধন করুন</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center p-4 py-12">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-gray-100 p-8 reveal active">
            <div class="text-center mb-8">
                <div class="w-16 h-16 primary-gradient rounded-2xl flex items-center justify-center text-white mx-auto mb-4 shadow-md">
                    <span class="material-symbols-outlined text-3xl">login</span>
                </div>
                <h1 class="font-display text-2xl font-bold text-gray-800">অ্যাকাউন্টে লগইন করুন</h1>
                <p class="text-xs text-gray-500 mt-1">আপনার সঠিক তথ্য দিয়ে একাউন্টে প্রবেশ করুন</p>
            </div>

            <form action="#" method="POST" class="space-y-5">
                <!-- Phone Number -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-2">ফোন নম্বর *</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3.5 top-3 text-gray-400 text-xl">call</span>
                        <input type="tel" required placeholder="017XXXXXXXX" class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-11 pr-4 py-2.5 text-sm focus:outline-none focus:border-[#b70011] focus:bg-white transition-all"/>
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-bold text-gray-700">পাসওয়ার্ড *</label>
                        <a href="#" class="text-xs text-[#b70011] font-medium hover:underline">পাসওয়ার্ড ভুলে গেছেন?</a>
                    </div>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3.5 top-3 text-gray-400 text-xl">lock</span>
                        <input type="password" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-11 pr-4 py-2.5 text-sm focus:outline-none focus:border-[#b70011] focus:bg-white transition-all"/>
                    </div>
                </div>

                <!-- Remember Me -->
                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="remember" class="w-4 h-4 rounded text-[#b70011] focus:ring-[#b70011] border-gray-300 cursor-pointer"/>
                    <label for="remember" class="text-xs text-gray-600 cursor-pointer">আমাকে সাইন ইন করে রাখুন</label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full primary-gradient text-white font-bold py-3.5 rounded-xl shadow-lg hover:opacity-95 transition-all active:scale-95 flex items-center justify-center gap-2">
                    সাইন ইন করুন <span class="material-symbols-outlined text-xl">arrow_forward</span>
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                <p class="text-xs text-gray-500">
                    সাইন ইন করার মাধ্যমে আপনি আমাদের 
                    <a href="#" class="text-[#b70011] font-medium hover:underline">শর্তাবলী</a> ও 
                    <a href="#" class="text-[#b70011] font-medium hover:underline">গোপনীয়তা নীতি</a> মেনে নিচ্ছেন।
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-100 bg-white py-4 text-center text-xs text-gray-500">
        © ২০২৬ Blood Donation Network। সর্বস্বত্ব সংরক্ষিত।
    </footer>

</body>
</html>
