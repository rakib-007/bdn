<!DOCTYPE html>
<html class="scroll-smooth" lang="bn">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>নিবন্ধন - BDN</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Anek+Bangla:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- External CSS -->
    <link rel="stylesheet" href="../style/style.css"/>
</head>
<body class="bg-white text-gray-900 font-bangla min-h-screen flex flex-col justify-between antialiased">

    <!-- Minimal Header -->
    <header class="w-full border-b border-gray-100">
        <div class="flex justify-between items-center px-6 md:px-12 h-16 max-w-5xl mx-auto">
            <a href="../index.html" class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-[#b70011]"></span>
                <span class="font-display text-xl font-bold tracking-tight text-gray-900">BDN</span>
            </a>
            <a href="signin.html" class="text-sm font-medium text-gray-500 hover:text-[#b70011] transition-colors">
                লগইন করুন →
            </a>
        </div>
    </header>

    <!-- Form Container -->
    <main class="flex-1 max-w-xl w-full mx-auto px-6 py-10">
        <div class="mb-8">
            <h1 class="font-display text-2xl md:text-3xl font-bold text-gray-900 tracking-tight">রক্তদাতা নিবন্ধন</h1>
            <p class="text-sm text-gray-500 mt-1">আপনার তথ্য দিয়ে রক্তদান নেটওয়ার্কের অংশ হোন</p>
        </div>

        <form action="#" method="POST" class="space-y-8">

            <!-- 1. Account -->
            <div class="space-y-4">
                <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400">১. অ্যাকাউন্ট তথ্য</h2>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1.5">পূর্ণ নাম *</label>
                    <input type="text" required placeholder="আপনার পুরো নাম" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-[#b70011] focus:bg-white transition-all"/>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1.5">ইমেইল ঠিকানা *</label>
                        <input type="email" required placeholder="name@example.com" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-[#b70011] focus:bg-white transition-all"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1.5">ফোন নম্বর *</label>
                        <input type="tel" required placeholder="017XXXXXXXX" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-[#b70011] focus:bg-white transition-all"/>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1.5">পাসওয়ার্ড *</label>
                        <input type="password" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-[#b70011] focus:bg-white transition-all"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1.5">পাসওয়ার্ড নিশ্চিত করুন *</label>
                        <input type="password" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-[#b70011] focus:bg-white transition-all"/>
                    </div>
                </div>
            </div>

            <hr class="border-gray-100"/>

            <!-- 2. Personal -->
            <div class="space-y-4">
                <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400">২. ব্যক্তিগত তথ্য</h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1.5">জন্ম তারিখ *</label>
                        <input type="date" required class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-[#b70011] focus:bg-white transition-all text-gray-700"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-2">লিঙ্গ</label>
                        <div class="flex items-center gap-5 text-sm text-gray-700">
                            <label class="flex items-center gap-1.5 cursor-pointer">
                                <input type="radio" name="gender" value="Male" checked class="text-[#b70011] focus:ring-0"/>
                                <span>পুরুষ</span>
                            </label>
                            <label class="flex items-center gap-1.5 cursor-pointer">
                                <input type="radio" name="gender" value="Female" class="text-[#b70011] focus:ring-0"/>
                                <span>মহিলা</span>
                            </label>
                            <label class="flex items-center gap-1.5 cursor-pointer">
                                <input type="radio" name="gender" value="Other" class="text-[#b70011] focus:ring-0"/>
                                <span>অন্যান্য</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-2">রক্তের গ্রুপ *</label>
                    <div class="grid grid-cols-4 sm:grid-cols-8 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="blood_group" value="A+" required class="peer hidden"/>
                            <div class="py-2 text-center text-xs font-semibold border border-gray-200 rounded-md peer-checked:bg-[#b70011] peer-checked:text-white peer-checked:border-[#b70011] hover:bg-gray-50 transition-all">A+</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="blood_group" value="A-" class="peer hidden"/>
                            <div class="py-2 text-center text-xs font-semibold border border-gray-200 rounded-md peer-checked:bg-[#b70011] peer-checked:text-white peer-checked:border-[#b70011] hover:bg-gray-50 transition-all">A-</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="blood_group" value="B+" class="peer hidden"/>
                            <div class="py-2 text-center text-xs font-semibold border border-gray-200 rounded-md peer-checked:bg-[#b70011] peer-checked:text-white peer-checked:border-[#b70011] hover:bg-gray-50 transition-all">B+</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="blood_group" value="B-" class="peer hidden"/>
                            <div class="py-2 text-center text-xs font-semibold border border-gray-200 rounded-md peer-checked:bg-[#b70011] peer-checked:text-white peer-checked:border-[#b70011] hover:bg-gray-50 transition-all">B-</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="blood_group" value="AB+" class="peer hidden"/>
                            <div class="py-2 text-center text-xs font-semibold border border-gray-200 rounded-md peer-checked:bg-[#b70011] peer-checked:text-white peer-checked:border-[#b70011] hover:bg-gray-50 transition-all">AB+</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="blood_group" value="AB-" class="peer hidden"/>
                            <div class="py-2 text-center text-xs font-semibold border border-gray-200 rounded-md peer-checked:bg-[#b70011] peer-checked:text-white peer-checked:border-[#b70011] hover:bg-gray-50 transition-all">AB-</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="blood_group" value="O+" class="peer hidden"/>
                            <div class="py-2 text-center text-xs font-semibold border border-gray-200 rounded-md peer-checked:bg-[#b70011] peer-checked:text-white peer-checked:border-[#b70011] hover:bg-gray-50 transition-all">O+</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="blood_group" value="O-" class="peer hidden"/>
                            <div class="py-2 text-center text-xs font-semibold border border-gray-200 rounded-md peer-checked:bg-[#b70011] peer-checked:text-white peer-checked:border-[#b70011] hover:bg-gray-50 transition-all">O-</div>
                        </label>
                    </div>
                </div>
            </div>

            <hr class="border-gray-100"/>

            <!-- 3. Address -->
            <div class="space-y-4">
                <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400">৩. ঠিকানা</h2>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1.5">বিভাগ *</label>
                        <select required class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#b70011] focus:bg-white transition-all text-gray-700">
                            <option value="">বিভাগ</option>
                            <option value="Dhaka">ঢাকা</option>
                            <option value="Chattogram">চট্টগ্রাম</option>
                            <option value="Rajshahi">রাজশাহী</option>
                            <option value="Khulna">খুলনা</option>
                            <option value="Barishal">বরিশাল</option>
                            <option value="Sylhet">সিলেট</option>
                            <option value="Rangpur">রংপুর</option>
                            <option value="Mymensingh">ময়মনসিংহ</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1.5">জেলা *</label>
                        <input type="text" required placeholder="জেলা" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-[#b70011] focus:bg-white transition-all"/>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1.5">উপজেলা/থানা *</label>
                        <input type="text" required placeholder="উপজেলা বা থানা" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-[#b70011] focus:bg-white transition-all"/>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1.5">পূর্ণাঙ্গ ঠিকানা (ঐচ্ছিক)</label>
                    <input type="text" placeholder="গ্রাম/মহল্লা, বাসা বা রোড নম্বর" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-[#b70011] focus:bg-white transition-all"/>
                </div>
            </div>

            <hr class="border-gray-100"/>

            <!-- 4. Donation Info -->
            <div class="space-y-4">
                <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400">৪. রক্তদানের ইতিহাস ও প্রাপ্যতা</h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-2">পূর্বে রক্তদান করেছেন?</label>
                        <div class="flex items-center gap-6 text-sm">
                            <label class="flex items-center gap-1.5 cursor-pointer">
                                <input type="radio" name="donated_before" value="Yes" onchange="toggleLastDonation(true)" class="text-[#b70011] focus:ring-0"/>
                                <span>হ্যাঁ</span>
                            </label>
                            <label class="flex items-center gap-1.5 cursor-pointer">
                                <input type="radio" name="donated_before" value="No" checked onchange="toggleLastDonation(false)" class="text-[#b70011] focus:ring-0"/>
                                <span>না</span>
                            </label>
                        </div>
                    </div>

                    <div id="last_donation_container" class="hidden">
                        <label class="block text-xs font-semibold text-gray-700 mb-1.5">সর্বশেষ রক্তদানের তারিখ</label>
                        <input type="date" id="last_donation_date" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-[#b70011] focus:bg-white transition-all text-gray-700"/>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-2">বর্তমানে রক্তদানে প্রস্তুত?</label>
                    <div class="flex gap-3">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="availability" value="Available" checked class="peer hidden"/>
                            <div class="py-2.5 text-center border border-gray-200 rounded-lg peer-checked:border-green-600 peer-checked:bg-green-50 peer-checked:text-green-700 font-medium text-xs transition-all">
                                ✅ প্রস্তুত (Available)
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="availability" value="Not Available" class="peer hidden"/>
                            <div class="py-2.5 text-center border border-gray-200 rounded-lg peer-checked:border-red-600 peer-checked:bg-red-50 peer-checked:text-red-700 font-medium text-xs transition-all">
                                ❌ অপ্রস্তুত (Not Available)
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Submit -->
            <div class="pt-4">
                <button type="submit" class="w-full bg-[#b70011] text-white font-bold py-3 rounded-xl hover:bg-red-700 transition-colors shadow-sm active:scale-[0.99] text-sm">
                    নিবন্ধন সম্পন্ন করুন
                </button>
            </div>
        </form>
    </main>

    <!-- Simple Footer -->
    <footer class="border-t border-gray-100 py-4 text-center text-xs text-gray-400">
        © ২০২৬ BDN. All rights reserved.
    </footer>

    <script>
        function toggleLastDonation(show) {
            const container = document.getElementById('last_donation_container');
            if (show) {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
